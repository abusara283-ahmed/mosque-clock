<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <script src="js/android-app.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#062b25">
  <title>ساعة المسجد</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/reader.css">
</head>
<body data-palette="emerald">
  <div class="pattern" aria-hidden="true"></div>

  <main id="board">
    <header class="top">
      <div class="mosque">
        <div class="mosque-name" id="mosqueName"></div>
        <div class="city"><span id="cityName"></span><span class="wx" id="wx"></span></div>
      </div>
      <div class="dates">
        <div class="weekday" id="weekday"></div>
        <div class="hijri" id="hijri"></div>
        <div class="greg" id="greg"></div>
        <div class="season" id="season" hidden></div>
      </div>
    </header>

    <div class="ticker" id="ticker" hidden><span class="tag">إعلان</span><span class="msg" id="tickerMsg"></span></div>

    <section class="center">
      <div class="clock-wrap">
        <div class="dial">
          <svg id="dial" viewBox="-142 -142 284 284" aria-hidden="true"></svg>
          <div class="dial-center">
            <div class="clock num"><span id="hm"></span><span class="sec" id="sec"></span><span class="ampm" id="ampm"></span></div>
            <div class="hero" id="hero">
              <div class="hero-label"><span id="heroLabel">الصلاة القادمة</span> <b class="hero-name" id="heroName"></b></div>
              <div class="hero-count num" id="heroCount"></div>
              <div class="hero-at"><span id="heroAt"></span><span class="dot">•</span><span id="heroIq"></span></div>
            </div>
          </div>
        </div>
      </div>
      <aside class="slide" id="slide">
        <div class="slide-kind" id="slideKind"></div>
        <div class="slide-text" id="slideText"></div>
        <div class="slide-ref" id="slideRef"></div>
      </aside>
    </section>

    <section class="prayers" id="prayers"></section>
  </main>

  <div class="overlay" id="overlay" hidden>
    <svg class="ov-ring" id="ovRing" viewBox="-110 -110 220 220" aria-hidden="true"><circle r="100" class="bg"/><circle r="100" class="fg" id="ovRingFg" transform="rotate(-90)"/></svg>
    <div class="ov-icon" id="ovIcon" hidden><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><rect x="14" y="5" width="20" height="38" rx="4"/><path d="M21 37h6"/><path d="M6 6l36 36"/></svg><span>فضلاً أغلق الهاتف</span></div>
    <div class="ov-title" id="ovTitle"></div>
    <div class="ov-big" id="ovBig"></div>
    <div class="ov-sub" id="ovSub"></div>
    <div class="ov-dots" id="ovDots"></div>
    <div class="ov-clock num" id="ovClock"></div>
  </div>

  <nav class="gear">
    <a href="announcements.html" title="الإعلانات" aria-label="الإعلانات"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1zM15 9a3 3 0 0 1 0 6M18 6a7 7 0 0 1 0 12"/></svg></a>
    <a href="settings.html" title="الإعدادات" aria-label="الإعدادات"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></a>
  </nav>

  <script src="js/settings-defaults.js"></script>
  <script src="js/config.js"></script>
  <script src="js/content.js"></script>
  <script src="js/adhkar-data.js"></script>
  <script src="data/fatwas.js"></script>
  <script src="data/prayer-table.js"></script>
  <script src="data/announcements.js"></script>
  <script src="js/prayertimes.js"></script>
  <script src="js/dial.js"></script>
  <script src="js/seasons.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/events.js"></script>
  <script src="js/timesync.js"></script>
  <script src="js/ticker.js"></script>
  <script src="js/announcements.js"></script>
  <script src="js/quran.js"></script>
  <script src="js/fatwa.js"></script>
  <script src="js/reader.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !window.AndroidClock) navigator.serviceWorker.register("sw.js").catch(function () {});
  </script>
</body>
</html>
