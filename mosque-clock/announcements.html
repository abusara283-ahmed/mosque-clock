<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <script src="js/android-app.js"></script>
  <script src="js/tvnav.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5a4b">
  <title>إعلانات المسجد</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    @font-face { font-family: "Kufi"; src: url("fonts/kufi-arabic.woff2") format("woff2"); font-weight: 100 900; }
    :root { --bg: #f4f1ea; --card: #fff; --line: #e2dccd; --text: #1f2a26; --muted: #6f7a74; --acc: #0b5a4b; --gold: #a57a22; --danger: #a33a2a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Kufi", Tahoma, sans-serif; font-size: 16px; }
    header { position: sticky; top: 0; z-index: 2; background: var(--acc); color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
    header h1 { font-size: 18px; margin: 0; flex: 1; }
    header a { color: #fff; font-size: 14px; }
    main { max-width: 640px; margin: 0 auto; padding: 14px 14px 120px; display: grid; gap: 12px; }
    .status { font-size: 13px; padding: 10px 12px; border-radius: 10px; background: #e7efe9; color: var(--acc); line-height: 1.7; }
    .status.warn { background: #f8eedb; color: #7a5313; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
    .card.off { opacity: .55; }
    .card .head { display: flex; align-items: center; gap: 8px; }
    .card .head b { flex: 1; font-size: 16px; }
    .pill { font-size: 12px; padding: 2px 10px; border-radius: 99px; background: var(--bg); color: var(--muted); }
    .pill.urgent { background: #fbe3dd; color: var(--danger); }
    .card p { margin: 0; color: var(--muted); line-height: 1.8; white-space: pre-wrap; }
    label { display: grid; gap: 5px; font-size: 13px; color: var(--muted); }
    input, textarea { font: inherit; color: var(--text); padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; width: 100%; }
    textarea { min-height: 110px; resize: vertical; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .chk { display: flex; align-items: center; gap: 10px; color: var(--text); font-size: 15px; }
    .chk input { width: 22px; height: 22px; }
    button { font: inherit; border: 0; border-radius: 10px; padding: 11px 16px; cursor: pointer; background: var(--acc); color: #fff; min-height: 44px; }
    button.light { background: var(--bg); color: var(--acc); }
    button.danger { background: transparent; color: var(--danger); border: 1px solid #e8c9c2; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .row button { flex: 1; }
    .bottom { position: fixed; bottom: 0; inset-inline: 0; background: rgba(244,241,234,.96); border-top: 1px solid var(--line); padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 10px; justify-content: center; }
    .bottom button { flex: 1; max-width: 300px; font-size: 17px; }
    #editor[hidden], .hidden { display: none !important; }
    #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; padding: 10px 18px; border-radius: 10px; opacity: 0; transition: opacity .3s; pointer-events: none; }
    #toast.show { opacity: 1; }
    select { font: inherit; color: var(--text); padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; width: 100%; }
    .days { display: flex; flex-wrap: wrap; gap: 6px; }
    .days label { display: flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--text); font-size: 14px; cursor: pointer; }
    .days input { display: none; } .days label:has(input:checked) { background: var(--acc); color: #fff; border-color: var(--acc); }
    .pill.k-alert { background: #fbecd6; color: #8a4f0c; } .pill.k-dua { background: #dff2ea; color: #1f6f5c; } .pill.k-lesson { background: #e1ebf8; color: #24508f; } .pill.k-condolence { background: #e6e7e9; color: #3d4247; }
    .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
  </style>
</head>
<body>
  <header>
    <h1>إعلانات المسجد</h1>
    <a href="index.html">الساعة</a>
    <a href="settings.html">الإعدادات</a>
  </header>

  <main>
    <div class="status" id="status"></div>
    <label id="pinBox" class="hidden">الرمز السري للخادم<input id="pin" type="password" inputmode="numeric" autocomplete="off"></label>

    <form class="card" id="editor" hidden>
      <label>العنوان<input id="fTitle" placeholder="مثال: درس بعد صلاة المغرب"></label>
      <label>النص<textarea id="fText" placeholder="تفاصيل الإعلان"></textarea></label>
      <div class="two">
        <label>من تاريخ<input id="fFrom" type="date"></label>
        <label>إلى تاريخ<input id="fTo" type="date"></label>
      </div>
      <div class="two">
        <label>النوع<select id="fKind"><option value="info">إعلان</option><option value="alert">تنبيه</option><option value="dua">دعاء</option><option value="lesson">درس</option><option value="condolence">تعزية</option><option value="urgent">عاجل</option></select></label>
        <label>الأولوية<select id="fPriority"><option value="1">عادية</option><option value="2">مهم (يتكرر مرتين)</option><option value="3">مهم جداً (ثلاث مرات ويتقدّم)</option></select></label>
      </div>
      <label>أين يظهر<select id="fShow"><option value="auto">حسب الإعداد العام</option><option value="ticker">الشريط المتحرك فقط</option><option value="screen">الشاشة الكاملة فقط</option><option value="both">الاثنان</option></select></label>
      <div class="two">
        <label>من الساعة (اختياري)<input id="fTimeFrom" type="time"></label>
        <label>إلى الساعة<input id="fTimeTo" type="time"></label>
      </div>
      <div class="days" id="fDays"></div>
      <label class="chk"><input id="fEnabled" type="checkbox" checked>مفعّل</label>
      <div class="row">
        <button type="submit">حفظ الإعلان</button>
        <button type="button" class="light" id="cancel">إلغاء</button>
      </div>
    </form>

    <div id="list"></div>

    <div class="card">
      <b>نقل الإعلانات</b>
      <p>بدون الخادم المحلي: صدّر الملف وضعه في مجلد data على جهاز الشاشة (أو في الاستضافة).</p>
      <div class="row">
        <button class="light" id="expJson">تصدير announcements.json</button>
        <button class="light" id="expJs">تصدير announcements.js</button>
      </div>
    </div>
  </main>

  <div class="bottom"><button id="add">+ إعلان جديد</button></div>
  <div id="toast"></div>

  <script src="data/announcements.js"></script>
  <script src="js/ticker.js"></script>
  <script>
  (function () {
    var KEY = "mosqueClock.ann.v1", PINKEY = "mosqueClock.pin";
    var list = [], editing = null, serverMode = false;
    var $ = function (id) { return document.getElementById(id); };

    function toast(m) { var t = $("toast"); t.textContent = m; t.classList.add("show"); setTimeout(function () { t.classList.remove("show"); }, 2200); }
    function esc(s) { return String(s || "").replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
    function today() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }

    function loadLocal() {
      try { var l = JSON.parse(localStorage.getItem(KEY) || "null"); if (l) return l; } catch (e) {}
      return (window.CLOCK_ANNOUNCEMENTS || []).slice();
    }
    function init() {
      try { $("pin").value = localStorage.getItem(PINKEY) || ""; } catch (e) {}
      if (!/^https?:$/.test(location.protocol)) return localMode();
      fetch("api/announcements", { cache: "no-store" }).then(function (r) { if (!r.ok) throw 0; return r.json(); })
        .then(function (j) {
          serverMode = true; list = j;
          $("status").className = "status";
          $("status").textContent = "متصل بخادم الساعة: أي تغيير تحفظه يظهر على الشاشة خلال دقيقة.";
          $("pinBox").classList.remove("hidden");
          render();
        }).catch(localMode);
    }
    // الإصدار ١٠: على جهاز الشاشة داخل تطبيق أندرويد: القائمة المشتركة مع الجوال (خادم التطبيق) هي المرجع
    var APP = window.MC_EMBEDDED && window.AndroidClock && typeof AndroidClock.remoteAnnouncements === "function" ? window.AndroidClock : null;
    function localMode() {
      list = loadLocal();
      if (APP) { try { var r = JSON.parse(APP.remoteAnnouncements() || "null"); if (Array.isArray(r)) list = r; } catch (e) {} }
      $("status").className = "status warn";
      $("status").textContent = "تعمل بدون خادم: الإعلانات تُحفظ في هذا الجهاز فقط. للتحكم من الجوال شغّل server.js على جهاز الشاشة، أو صدّر الملف وانسخه إلى مجلد data.";
      render();
    }

    function persist() {
      if (!serverMode) {
        try { localStorage.setItem(KEY, JSON.stringify(list)); if (APP && APP.remotePutAnnouncements) APP.remotePutAnnouncements(JSON.stringify(list)); toast("تم الحفظ"); } catch (e) { toast("تعذّر الحفظ"); }
        return Promise.resolve();
      }
      var pin = $("pin").value.trim();
      try { localStorage.setItem(PINKEY, pin); } catch (e) {}
      return fetch("api/announcements", { method: "POST", headers: { "Content-Type": "application/json", "X-Pin": pin }, body: JSON.stringify(list) })
        .then(function (r) {
          if (r.status === 403) { toast("الرمز السري غير صحيح"); throw 0; }
          if (!r.ok) { toast("تعذّر الحفظ على الخادم"); throw 0; }
          toast("أُرسل إلى الشاشة");
        });
    }

    function status(a) {
      var t = today();
      if (a.enabled === false) return "متوقف";
      if (a.to && a.to < t) return "منتهٍ";
      if (a.from && a.from > t) return "مجدول";
      if (window.ClockTicker && !ClockTicker.isActive(a, new Date())) return "يُعرض في أيامه وساعاته";
      return "يُعرض الآن";
    }
    var WD = ["أحد", "اثنين", "ثلاثاء", "أربعاء", "خميس", "جمعة", "سبت"];
    $("fDays").innerHTML = '<span style="font-size:13px;color:var(--muted);width:100%">الأيام (لا شيء = كل الأيام)</span>' + WD.map(function (n, i) { return '<label><input type="checkbox" value="' + i + '">' + n + "</label>"; }).join("");
    function render() {
      if (!list.length) { $("list").innerHTML = '<div class="empty">لا توجد إعلانات بعد.</div>'; return; }
      $("list").innerHTML = list.map(function (a, i) {
        var st = status(a);
        return '<div class="card' + (st === "يُعرض الآن" ? "" : " off") + '" style="margin-bottom:12px">' +
          '<div class="head"><b>' + esc(a.title || "بدون عنوان") + "</b>" +
          (a.urgent || a.kind === "urgent" ? '<span class="pill urgent">عاجل</span>' : a.kind && a.kind !== "info" && window.ClockTicker ? '<span class="pill k-' + a.kind + '">' + ClockTicker.KINDS[a.kind].name + "</span>" : "") +
          (+a.priority > 1 ? '<span class="pill">' + (+a.priority === 3 ? "مهم جداً" : "مهم") + "</span>" : "") + '<span class="pill">' + st + "</span></div>" +
          "<p>" + esc(a.text) + "</p>" +
          ((a.from || a.to) ? '<p style="font-size:13px">' + esc(a.from || "…") + " ← " + esc(a.to || "…") + "</p>" : "") +
          ((a.timeFrom || a.timeTo || (a.days && a.days.length)) ? '<p style="font-size:13px">' + (a.days && a.days.length ? a.days.map(function (x) { return WD[x]; }).join("، ") + " " : "") + (a.timeFrom || a.timeTo ? "الساعة " + esc(a.timeFrom || "00:00") + " – " + esc(a.timeTo || "24:00") : "") + "</p>" : "") +
          '<div class="row"><button class="light" data-edit="' + i + '">تعديل</button>' +
          '<button class="light" data-toggle="' + i + '">' + (a.enabled === false ? "تفعيل" : "إيقاف") + "</button>" +
          '<button class="danger" data-del="' + i + '">حذف</button></div></div>';
      }).join("");
    }

    function openEditor(a) {
      editing = a;
      $("fTitle").value = a ? a.title || "" : "";
      $("fText").value = a ? a.text || "" : "";
      $("fFrom").value = a ? a.from || "" : "";
      $("fTo").value = a ? a.to || "" : "";
      $("fKind").value = a ? (a.urgent ? "urgent" : a.kind || "info") : "info";
      $("fPriority").value = a ? String(a.priority || 1) : "1";
      $("fShow").value = a ? a.show || "auto" : "auto";
      $("fTimeFrom").value = a ? a.timeFrom || "" : "";
      $("fTimeTo").value = a ? a.timeTo || "" : "";
      $("fDays").querySelectorAll("input").forEach(function (c) { c.checked = !!(a && a.days && a.days.indexOf(+c.value) >= 0); });
      $("fEnabled").checked = a ? a.enabled !== false : true;
      $("editor").hidden = false;
      $("editor").scrollIntoView({ behavior: "smooth" });
      $("fTitle").focus();
    }
    $("add").onclick = function () { openEditor(null); };
    $("cancel").onclick = function () { $("editor").hidden = true; };
    $("editor").onsubmit = function (e) {
      e.preventDefault();
      var a = {
        id: editing ? editing.id : uid(),
        title: $("fTitle").value.trim(), text: $("fText").value.trim(),
        from: $("fFrom").value, to: $("fTo").value,
        kind: $("fKind").value, urgent: $("fKind").value === "urgent", priority: +$("fPriority").value, show: $("fShow").value,
        timeFrom: $("fTimeFrom").value, timeTo: $("fTimeTo").value,
        days: [].slice.call($("fDays").querySelectorAll("input:checked")).map(function (c) { return +c.value; }),
        enabled: $("fEnabled").checked
      };
      if (!a.title && !a.text) return toast("اكتب عنواناً أو نصاً");
      if (editing) list[list.indexOf(editing)] = a; else list.unshift(a);
      $("editor").hidden = true;
      persist().then(render, render);
    };
    $("list").onclick = function (e) {
      var b = e.target.closest("button"); if (!b) return;
      if (b.dataset.edit) openEditor(list[+b.dataset.edit]);
      if (b.dataset.toggle) { var a = list[+b.dataset.toggle]; a.enabled = a.enabled === false; persist().then(render, render); }
      if (b.dataset.del && confirm("حذف هذا الإعلان؟")) { list.splice(+b.dataset.del, 1); persist().then(render, render); }
    };
    function download(name, text, type) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([text], { type: type })); a.download = name; a.click();
    }
    $("expJson").onclick = function () { download("announcements.json", JSON.stringify(list, null, 2), "application/json"); };
    $("expJs").onclick = function () { download("announcements.js", "window.CLOCK_ANNOUNCEMENTS = " + JSON.stringify(list, null, 2) + ";\n", "text/javascript"); };
    init();
  })();
  </script>
</body>
</html>
